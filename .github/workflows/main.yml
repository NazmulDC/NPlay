name: Build NPlay APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nplay_flutter
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project files
        run: |
          flutter create --platforms=android --org com.nazmul --project-name nplay .
          rm -rf test NPlay_v4_upload
          cp -r overrides/android/. android/
          python3 - <<'PY'
          import re, glob
          for f in glob.glob('android/app/build.gradle*') + glob.glob('android/settings.gradle*'):
              s = open(f).read()
              if f.endswith('.kts'):
                  s2 = re.sub(r'compileSdk\s*=\s*[^\n]*', 'compileSdk = 36', s)
              else:
                  s2 = re.sub(r'compileSdkVersion\s+[^\n]*', 'compileSdkVersion 36', s)
              if s2 != s:
                  open(f, 'w').write(s2)
                  print('patched', f)
          PY
          echo "---- app/build.gradle(.kts) compileSdk line(s): ----"
          grep -n -i "compileSdk" android/app/build.gradle* || true

      - name: Get packages
        run: flutter pub get

      - name: Patch file_picker's own compileSdk (its published Android code is stuck at 34)
        run: |
          CACHE="${PUB_CACHE:-$HOME/.pub-cache}"
          FP_DIR=$(find "$CACHE/hosted" -maxdepth 2 -iname "file_picker-*" -type d | head -1)
          echo "file_picker package dir: $FP_DIR"
          if [ -n "$FP_DIR" ] && [ -f "$FP_DIR/android/build.gradle" ]; then
            echo "---- before ----"
            grep -n -i "compileSdk" "$FP_DIR/android/build.gradle" || true
            sed -i -E 's/compileSdkVersion[[:space:]]+[0-9]+/compileSdkVersion 36/' "$FP_DIR/android/build.gradle"
            sed -i -E 's/compileSdk([[:space:]]|=)[[:space:]]*[0-9]+/compileSdk\1 36/' "$FP_DIR/android/build.gradle"
            echo "---- after ----"
            grep -n -i "compileSdk" "$FP_DIR/android/build.gradle" || true
          else
            echo "file_picker android/build.gradle not found (nothing to patch)"
          fi

      - name: Check code (errors show at the top of the run page)
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.log || true
          grep -E " error • " analyze.log | head -40 | while IFS= read -r line; do echo "::error::$line"; done || true
          if grep -q " error • " analyze.log; then exit 1; fi

      - name: Build release APK
        run: |
          flutter build apk --release --split-per-abi --no-shrink 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            awk '/What went wrong/{f=1} f' build.log | head -60 > wrong.log
            if [ -s wrong.log ]; then
              while IFS= read -r line; do echo "::error::$line"; done < wrong.log
            else
              grep -E "(Error|error):|\.dart:[0-9]+|FAILED|e: " build.log | head -40 | while IFS= read -r line; do echo "::error::$line"; done || true
            fi
          fi
          exit $code

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NPlay-APK
          path: nplay_flutter/build/app/outputs/flutter-apk/*.apk
